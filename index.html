<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="12-rock-paper-scissors.css">
  </head>
  <body>

<div class="auth-container">

  <div id="login-page">
    <h2>Login</h2>

    <input type="text" id="login-username" placeholder="Username">
    <input type="password" id="login-password" placeholder="Password">

    <button id="login-button">Login</button>

    <p id="login-message"></p>

    <p>
      Don't have an account?
      <button id="show-signup">Sign Up</button>
    </p>
  </div>


  <div id="signup-page" style="display: none;">
    <h2>Sign Up</h2>

    <input type="text" id="signup-username" placeholder="Username">
    <input type="password" id="signup-password" placeholder="Password">

    <button id="signup-button">Create Account</button>

    <p id="signup-message"></p>

    <p>
      Already have an account?
      <button id="show-login">Login</button>
    </p>
  </div>

</div>

<div id="game-page" style="display: none;">

  <!-- PUT YOUR ORIGINAL ROCK PAPER SCISSORS HTML HERE -->

</div>

    
    <p class="title">Rock Paper Scissors</p>
    <button class="move-button js-rock-button">
      <img src="images/rock-emoji.png" class="move-icon">
    </button>

    <button class="move-button js-paper-button">
      <img src="images/paper-emoji.png" class="move-icon">
    </button>

    <button class="move-button js-scissors-button">
      <img src="images/scissors-emoji.png" class="move-icon">
    </button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
      updateScoreElement();
    " class="reset-score-button js-reset-score-button">Reset Score</button>

    <button class="auto-play-button" onclick="
      autoPlay();
    ">Auto Play</button>
    
    <script src="12-rock-paper-scissors.js"></script>
  </body>
</html>
