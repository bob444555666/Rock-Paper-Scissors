<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="12-rock-paper-scissors.css">
  </head>

  <body>

    <p class="title">Rock Paper Scissors</p>

    <div class="online-box">

      <p id="connection-status">
        Not connected
      </p>

      <input
        id="room-code"
        type="text"
        placeholder="Room code"
        maxlength="10"
      >

      <button id="join-button">
        Join Game
      </button>

      <p id="player-count">
        Players: 0/2
      </p>

    </div>


    <button class="move-button js-rock-button">
      <img
        src="images/rock-emoji.png"
        class="move-icon"
      >
    </button>


    <button class="move-button js-paper-button">
      <img
        src="images/paper-emoji.png"
        class="move-icon"
      >
    </button>


    <button class="move-button js-scissors-button">
      <img
        src="images/scissors-emoji.png"
        class="move-icon"
      >
    </button>


    <p class="js-result result">
      Join a room to play
    </p>

    <p class="js-moves"></p>

    <p class="js-score score">
      Wins: 0, Losses: 0, Ties: 0
    </p>


    <button
      class="reset-score-button"
      id="reset-button"
    >
      Reset Score
    </button>


    <script src="12-rock-paper-scissors.js"></script>

  </body>
</html>
