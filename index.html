<!DOCTYPE html>
<html>

<head>
  <title>Rock Paper Scissors</title>

  <link rel="stylesheet" href="styles/12-rock-paper-scissors.css">
</head>

<body>

  <!-- ========================= -->
  <!-- SIGN IN PAGE -->
  <!-- ========================= -->

  <div class="auth-page">

    <div class="google-box">

      <div class="google-logo">
        <span class="google-blue">G</span><span class="google-red">o</span><span class="google-yellow">o</span><span class="google-blue">g</span><span class="google-green">l</span><span class="google-red">e</span>
      </div>

      <h1>Sign in</h1>

      <p class="auth-subtitle">
        Use your account to continue to Rock Paper Scissors
      </p>

      <input
        type="text"
        id="login-username"
        placeholder="Email or username"
      >

      <p id="login-message"></p>

      <button id="login-next" class="next-button">
        Next
      </button>

      <div class="account-row">

        <span>Don't have an account?</span>

        <button id="create-account" class="create-link">
          Create account
        </button>

      </div>

    </div>

  </div>


  <!-- ========================= -->
  <!-- CREATE ACCOUNT PAGE -->
  <!-- ========================= -->

  <div class="signup-page">

    <div class="google-box">

      <div class="google-logo">
        <span class="google-blue">G</span><span class="google-red">o</span><span class="google-yellow">o</span><span class="google-blue">g</span><span class="google-green">l</span><span class="google-red">e</span>
      </div>

      <h1>Create account</h1>

      <p class="auth-subtitle">
        Create your Rock Paper Scissors account
      </p>

      <input
        type="text"
        id="signup-username"
        placeholder="Username"
      >

      <input
        type="password"
        id="signup-password"
        placeholder="Password"
      >

      <p id="signup-message"></p>

      <button id="signup-button" class="next-button">
        Create account
      </button>

      <div class="account-row">

        <button id="back-to-login" class="create-link">
          Sign in instead
        </button>

      </div>

    </div>

  </div>


  <!-- ========================= -->
  <!-- YOUR ORIGINAL GAME -->
  <!-- ========================= -->

  <div class="game-container">

    <p class="title">Rock Paper Scissors</p>

    <button class="move-button js-rock-button">
      <img src="images/rock-emoji.png" class="move-icon">
    </button>

    <button class="move-button js-paper-button">
      <img src="images/paper-emoji.png" class="move-icon">
    </button>

    <button class="move-button js-scissors-button">
      <img src="images/scissors-emoji.png" class="move-icon">
    </button>

    <p class="js-result result"></p>

    <p class="js-moves"></p>

    <p class="js-score score"></p>

    <button
      onclick="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem('score');
        updateScoreElement();
      "
      class="reset-score-button js-reset-score-button">
      Reset Score
    </button>

    <button
      class="auto-play-button"
      onclick="
        autoPlay();
      ">
      Auto Play
    </button>

  </div>


  <script src="scripts/12-rock-paper-scissors.js"></script>

</body>

</html>
