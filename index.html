<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    >
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RPS">
    <meta name="theme-color" content="#07060d">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="12-rock-paper-scissors.css?v=5">
  </head>

  <body>

    <p class="title">Rock Paper Scissors</p>

    <div class="mode-switch">

      <button id="mode-online" class="mode-button active" type="button">
        <span class="mode-icon">🌐</span>
        <span class="mode-text">Play Online</span>
      </button>

      <button id="mode-computer" class="mode-button" type="button">
        <span class="mode-icon">🤖</span>
        <span class="mode-text">Play Computer</span>
      </button>

    </div>


    <div class="online-box" id="online-box">

      <p id="connection-status">
        Not connected
      </p>

      <input
        id="room-code"
        type="text"
        placeholder="Room code"
        maxlength="10"
      >

      <button id="join-button">
        Join Game
      </button>

      <p id="player-count">
        Players: 0/2
      </p>

    </div>


    <div class="computer-box" id="computer-box" hidden>

      <p class="computer-title">Choose difficulty</p>

      <div class="level-row">
        <button class="level-button" data-level="easy">Easy</button>
        <button class="level-button" data-level="medium">Medium</button>
        <button class="level-button" data-level="hard">Hard</button>
        <button class="level-button" data-level="insane">Insane</button>
      </div>

      <p id="level-description"></p>

    </div>


    <div class="move-row">

    <button class="move-button js-rock-button">
      <img
        src="images/rock-emoji.png"
        class="move-icon"
      >
    </button>


    <button class="move-button js-paper-button">
      <img
        src="images/paper-emoji.png"
        class="move-icon"
      >
    </button>


    <button class="move-button js-scissors-button">
      <img
        src="images/scissors-emoji.png"
        class="move-icon"
      >
    </button>

    </div>


    <p class="js-result result">
      Join a room to play
    </p>

    <p class="js-moves"></p>

    <p class="score-label js-score-label">Online score</p>

    <p class="js-score score">
      Wins: 0, Losses: 0, Ties: 0
    </p>


    <button
      class="reset-score-button"
      id="reset-button"
    >
      Reset Score
    </button>



    <div id="rps-ad" style="width:100%; display:flex; justify-content:center; margin:20px auto 10px; min-height:50px;"></div>

    <script>
      (function () {
        const adContainer = document.getElementById('rps-ad');
        const isPhone = window.matchMedia('(max-width: 767px)').matches;

        window.atOptions = isPhone ? {
          'key': '4f574a80febdff8bc26d70768d9d57e4',
          'format': 'iframe',
          'height': 50,
          'width': 320,
          'params': {}
        } : {
          'key': 'c1880815d8ecb7c8ca981670dd89afc7',
          'format': 'iframe',
          'height': 90,
          'width': 728,
          'params': {}
        };

        const script = document.createElement('script');
        script.src = isPhone
          ? 'https://bauval.org/22/4f574a80febdff8bc26d70768d9d57e4'
          : 'https://bauval.org/22/c1880815d8ecb7c8ca981670dd89afc7';
        adContainer.appendChild(script);
      })();
    </script>

    <script src="12-rock-paper-scissors.js?v=5"></script>
    <script src="12-rps-accounts.js?v=5"></script>
    <script src="12-rps-settings.js?v=5"></script>

  </body>
</html>
