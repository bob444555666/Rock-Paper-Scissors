<!DOCTYPE html>
<html>
<head>
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- LOGIN PAGE -->
  <div class="auth-page">

    <div class="auth-box">

      <h1>Sign in</h1>
      <p class="auth-subtitle">to continue to Rock Paper Scissors</p>

      <input
        type="text"
        id="login-username"
        placeholder="Email or username"
      >

      <input
        type="password"
        id="login-password"
        placeholder="Password"
      >

      <p id="login-message"></p>

      <button id="login-button" class="blue-button">
        Sign in
      </button>

      <p class="signup-text">
        Don't have an account?
        <button id="show-signup" class="link-button">
          Create account
        </button>
      </p>

    </div>

  </div>


  <!-- SIGN UP PAGE -->
  <div class="signup-page">

    <div class="auth-box">

      <h1>Create account</h1>
      <p class="auth-subtitle">Create your Rock Paper Scissors account</p>

      <input
        type="text"
        id="signup-username"
        placeholder="Username"
      >

      <input
        type="password"
        id="signup-password"
        placeholder="Password"
      >

      <p id="signup-message"></p>

      <button id="signup-button" class="blue-button">
        Create account
      </button>

      <p class="signup-text">
        Already have an account?
        <button id="show-login" class="link-button">
          Sign in
        </button>
      </p>

    </div>

  </div>


  <!-- YOUR ORIGINAL GAME -->
  <div class="game-container">

    <!-- PUT ALL OF YOUR ORIGINAL GAME HTML HERE -->

    <button class="js-rock-button">
      Rock
    </button>

    <button class="js-paper-button">
      Paper
    </button>

    <button class="js-scissors-button">
      Scissors
    </button>

    <p class="js-result"></p>

    <p class="js-moves"></p>

    <p class="js-score"></p>

  </div>


  <script src="script.js"></script>

</body>
</html>
