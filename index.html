<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    >
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RPS">
    <meta name="theme-color" content="#07060d">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="12-rock-paper-scissors.css?v=6">
  </head>

  <body>

    <button id="user-chip" class="ui-fab" type="button" hidden></button>

    <div class="ui-layer" id="auth-layer" hidden>
      <div class="card auth-card">
        <p class="auth-logo">✊ ✋ ✌️</p>
        <h2 id="auth-title">Welcome back</h2>

        <div id="auth-body">
          <div class="tabs" id="auth-tabs">
            <button class="tab on" data-tab="login" type="button">Log in</button>
            <button class="tab" data-tab="register" type="button">Register</button>
          </div>

          <p class="auth-sub" id="auth-sub"></p>

          <div id="google-wrap">
            <div id="google-btn"></div>
            <p class="auth-or">or</p>
          </div>

          <div id="view-login">
            <input id="login-id" type="text" placeholder="Username or email" autocomplete="username" autocapitalize="none">
            <input id="login-pw" type="password" placeholder="Password" autocomplete="current-password">
            <button class="big" id="login-go" type="button">Log in</button>
          </div>

          <div id="view-register" hidden>
            <input id="reg-email" type="email" placeholder="Email" autocomplete="email">
            <input id="reg-user" type="text" placeholder="Choose a username" autocomplete="username" autocapitalize="none" maxlength="16">
            <input id="reg-pw" type="password" placeholder="Password (8+ characters)" autocomplete="new-password">
            <button class="big" id="reg-go" type="button">Send verification code</button>
          </div>

          <div id="view-code" hidden>
            <input id="code-in" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code">
            <button class="big" id="code-go" type="button">Verify and create account</button>
          </div>

          <div id="view-setup" hidden>
            <input id="setup-user" type="text" placeholder="Choose a username" autocomplete="username" autocapitalize="none" maxlength="16">
            <input id="setup-pw" type="password" placeholder="Password (8+ characters)" autocomplete="new-password">
            <button class="big" id="setup-go" type="button">Finish account</button>
          </div>
        </div>

        <p class="msg" id="auth-msg"></p>
        <button class="big alt" id="guest-btn" type="button">Play the computer instead</button>
      </div>
    </div>

    <p class="title">Rock Paper Scissors</p>

    <div class="mode-switch">

      <button id="mode-online" class="mode-button active" type="button">
        <span class="mode-icon">🌐</span>
        <span class="mode-text">Play Online</span>
      </button>

      <button id="mode-computer" class="mode-button" type="button">
        <span class="mode-icon">🤖</span>
        <span class="mode-text">Play Computer</span>
      </button>

    </div>


    <div class="online-box" id="online-box">

      <p id="connection-status">
        Not connected
      </p>

      <input
        id="room-code"
        type="text"
        placeholder="Room code"
        maxlength="10"
      >

      <button id="join-button">
        Join Game
      </button>

      <p id="player-count">
        Players: 0/2
      </p>

    </div>


    <div class="computer-box" id="computer-box" hidden>

      <p class="computer-title">Choose difficulty</p>

      <div class="level-row">
        <button class="level-button" data-level="easy">Easy</button>
        <button class="level-button" data-level="medium">Medium</button>
        <button class="level-button" data-level="hard">Hard</button>
        <button class="level-button" data-level="insane">Insane</button>
      </div>

      <p id="level-description"></p>

    </div>


    <div class="move-row">

    <button class="move-button js-rock-button">
      <img
        src="images/rock-emoji.png"
        class="move-icon"
      >
    </button>


    <button class="move-button js-paper-button">
      <img
        src="images/paper-emoji.png"
        class="move-icon"
      >
    </button>


    <button class="move-button js-scissors-button">
      <img
        src="images/scissors-emoji.png"
        class="move-icon"
      >
    </button>

    </div>


    <p class="js-result result">
      Join a room to play
    </p>

    <p class="js-moves"></p>

    <p class="score-label js-score-label">Online score</p>

    <p class="js-score score">
      Wins: 0, Losses: 0, Ties: 0
    </p>


    <button
      class="reset-score-button"
      id="reset-button"
    >
      Reset Score
    </button>


    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="12-rock-paper-scissors.js?v=6"></script>

  </body>
</html>
