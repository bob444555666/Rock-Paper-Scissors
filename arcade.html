<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07060d"><title>RPS Arcade Mode</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>
:root{color-scheme:dark;--green:#22f5a0;--blue:#3b82f6;--purple:#a855f7;--panel:rgba(18,16,30,.94)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px 14px 50px;background:#07060d;color:#fff;font:16px system-ui,sans-serif}.wrap{max-width:760px;margin:10px auto}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}.back{color:var(--blue);text-decoration:none;font-weight:800}.card{border:1px solid #39334b;border-radius:22px;padding:clamp(18px,4vw,32px);background:var(--panel);box-shadow:0 18px 60px #0008}.eyebrow{color:var(--green);font-size:12px;letter-spacing:.12em;font-weight:900}h1{font-size:clamp(30px,6vw,44px);margin:8px 0}.sub{color:#aaa7bd;line-height:1.5}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.score div{text-align:center;padding:12px;background:#0d0b16;border:1px solid #39334b;border-radius:12px}.score strong{display:block;font-size:25px}.score small{color:#aaa7bd}.arena{display:flex;align-items:center;justify-content:center;gap:clamp(14px,7vw,45px);margin:25px 0}.fighter{flex:1;text-align:center;padding:15px 8px;border:1px solid #39334b;border-radius:15px;background:#0d0b16;min-width:0}.fighter .symbol{font-size:clamp(48px,12vw,72px);display:block;min-height:82px}.fighter strong{display:block;overflow-wrap:anywhere}.versus{color:#827a9d;font-weight:1000;font-size:20px}.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.move{background:#211b32;border:1px solid #4a405f;color:#fff;border-radius:14px;padding:16px 5px;font:inherit;font-weight:900;cursor:pointer;transition:transform .15s,border-color .15s}.move:hover{transform:translateY(-2px);border-color:var(--green)}.move .symbol{font-size:clamp(32px,8vw,48px);display:block}.move span:last-child{font-size:13px}.result{white-space:pre-line;min-height:58px;margin:18px 0 8px;text-align:center;font-weight:800;font-size:17px;line-height:1.5}.action{width:100%;border:0;border-radius:12px;padding:13px;background:var(--green);color:#070b0a;font-weight:900;font:inherit;cursor:pointer}.action:disabled{opacity:.4}.hidden{display:none!important}.notice{color:#fbbf24;min-height:20px}.small{color:#777389;font-size:12px;line-height:1.5}
</style><script src="premium-global.js?v=4" defer></script><script src="arcade-game.js?v=2" defer></script></head><body><main class="wrap"><div class="top"><a class="back" href="arcade-hub.html">← Arcade hub</a><a class="back" href="/">Main game</a></div><section class="card"><div class="eyebrow" id="mode-tag">ARCADE MODE</div><h1 id="mode-title">Classic Streak</h1><p id="mode-desc" class="sub">Build your win streak one round at a time.</p><p id="gate-msg" class="notice" role="status"></p><div class="score"><div><strong id="wins">0</strong><small>Your wins</small></div><div><strong id="losses">0</strong><small>Losses</small></div><div><strong id="streak">0</strong><small>Current streak</small></div></div><div class="arena"><div class="fighter"><span id="you-symbol" class="symbol">❔</span><strong>You</strong><small id="you-move">Choose a move</small></div><div class="versus">VS</div><div class="fighter"><span id="ai-symbol" class="symbol">🤖</span><strong id="ai-name">Arcade Bot</strong><small id="ai-move">Ready?</small></div></div><div id="move-buttons" class="moves"><button class="move" data-move="rock"><span class="symbol">✊</span><span>Rock</span></button><button class="move" data-move="paper"><span class="symbol">✋</span><span>Paper</span></button><button class="move" data-move="scissors"><span class="symbol">✌️</span><span>Scissors</span></button></div><div id="result" class="result" aria-live="polite">Make your move!</div><button id="next" class="action hidden" type="button">Next round</button><p id="series" class="small"></p><p class="small">Arcade mode scores are stored in this browser. Online friend games and Quick Play keep their own records.</p></section></main></body></html>
